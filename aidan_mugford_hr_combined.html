  {l:"Moderate (May 8,11,12,13,15)",a:()=>set(["May 8","May 11","May 12","May 13","May 15"])},
  {l:"Quiet (May 19)",a:()=>set(["May 19"])}
].forEach(f=>{
  const btn=document.createElement('button');
  btn.textContent=f.l;
  btn.style.cssText="font-size:11px;padding:2px 9px;cursor:pointer;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);";
  btn.addEventListener('click',()=>{f.a();updateChart();});
  df.appendChild(btn);
});
function set(arr){activeDays=new Set(arr);document.querySelectorAll('#legend button').forEach(b=>{b.style.opacity=activeDays.has(b.dataset.day)?'1':'0.35';});}

let chart;
function buildDS(){
  return days.filter(d=>activeDays.has(d)).map(day=>({
    label:day,data:rawData[day].map(([m,b])=>({x:m,y:b})),
    borderColor:palette[day],backgroundColor:palette[day]+'20',
    fill:false,tension:0.3,pointRadius:2.5,pointHoverRadius:5,borderWidth:1.8
  }));
}
function updateChart(){chart.data.datasets=buildDS();chart.update();}

const ctx=document.getElementById('hrChart').getContext('2d');
chart=new Chart(ctx,{
  type:'line',
  data:{datasets:buildDS()},
  options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{
      legend:{display:false},
      tooltip:{callbacks:{title(i){return toTimeLabel(i[0].parsed.x);},label(i){return i.dataset.label+': '+Math.round(i.parsed.y)+' bpm';}}}
    },
    scales:{
      x:{type:'linear',min:7*60,max:21*60,ticks:{stepSize:60,callback(v){return toTimeLabel(v);}},grid:{color:'rgba(128,128,128,0.1)'},title:{display:true,text:'Time of day',font:{size:11},color:'#888'}},
      y:{min:55,max:185,ticks:{callback(v){return v+' bpm';}},grid:{color:'rgba(128,128,128,0.1)'},title:{display:true,text:'Heart rate (bpm)',font:{size:11},color:'#888'}}
    }
  },
  plugins:[{id:'zones',beforeDraw(c){
    const{ctx,chartArea:{left,right,top,bottom},scales:{y}}=c;
    ctx.save();
    const y100=y.getPixelForValue(100),y150=y.getPixelForValue(150);
    ctx.fillStyle='rgba(186,117,23,0.05)';ctx.fillRect(left,y100,right-left,bottom-y100);
    ctx.setLineDash([6,4]);ctx.strokeStyle='rgba(186,117,23,0.45)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(left,y100);ctx.lineTo(right,y100);ctx.stroke();
    ctx.fillStyle='rgba(162,45,45,0.05)';ctx.fillRect(left,top,right-left,y150-top);
    ctx.setLineDash([]);ctx.strokeStyle='rgba(162,45,45,0.55)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(left,y150);ctx.lineTo(right,y150);ctx.stroke();
    ctx.restore();
  }}]
});
</script>
